<!DOCTYPE html>
<html lang="bg">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Далечна къща</title>
<style>
:root{
  --bg:#0f1115; --card:#171a21; --border:#2a2e38; --text:#e8e9ec; --text2:#8b8f9a;
  --green:#3ecf8e; --red:#e5484d; --blue:#5b9fed; --off:#3a3f4a;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --bg:#f5f6f8; --card:#ffffff; --border:#e2e5ea; --text:#1a1d23; --text2:#6b7280;
    --off:#d1d5db;
  }
}
:root[data-theme="dark"]{
  --bg:#0f1115; --card:#171a21; --border:#2a2e38; --text:#e8e9ec; --text2:#8b8f9a; --off:#3a3f4a;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:-apple-system,Segoe UI,Roboto,sans-serif;
     margin:0;padding:20px;max-width:480px;margin-inline:auto;min-height:100vh}
h1{font-size:20px;font-weight:600;margin-bottom:16px;text-align:center}
.status-line{text-align:center;font-size:13px;color:var(--text2);margin-bottom:16px}
.status-line.online{color:var(--green)}
.status-line.offline{color:var(--red)}
.card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:18px;margin-bottom:14px}
.temps{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.temp-box{background:var(--bg);border-radius:8px;padding:14px;text-align:center}
.temp-val{font-size:24px;font-weight:700;color:var(--blue)}
.temp-lbl{font-size:11px;color:var(--text2);margin-top:4px;text-transform:uppercase;letter-spacing:.5px}
.relay-row{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid var(--border)}
.relay-row:last-child{border-bottom:none}
.relay-name{font-size:15px}
.sw{width:54px;height:30px;border-radius:15px;border:none;cursor:pointer;position:relative;transition:background .2s}
.sw.on{background:var(--green)}
.sw.off{background:var(--off)}
.sw::after{content:'';position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:transform .2s}
.sw.on::after{transform:translateX(24px)}
.footer-note{text-align:center;font-size:11px;color:var(--text2);margin-top:20px}
.ac-modes{display:flex;gap:8px;margin-bottom:12px}
.ac-btn{flex:1;padding:10px 6px;border-radius:8px;border:none;background:var(--bg);color:var(--text2);font-size:13px;cursor:pointer}
.ac-btn.active{background:var(--blue);color:#fff}
.ac-temp{display:flex;align-items:center;justify-content:center;gap:16px;margin-bottom:14px}
.ac-temp-val{font-size:28px;font-weight:700;min-width:64px;text-align:center}
.ac-round{width:40px;height:40px;border-radius:50%;border:none;background:var(--bg);color:var(--text);font-size:20px;cursor:pointer}
#gate{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;z-index:100;padding:20px}
#gate-box{width:100%;max-width:320px;text-align:center}
#gate-box h2{font-size:18px;margin-bottom:16px}
#gate-input{width:100%;padding:14px;border-radius:10px;border:1px solid var(--border);background:var(--card);color:var(--text);font-size:16px;text-align:center;box-sizing:border-box}
#gate-btn{width:100%;margin-top:12px;padding:14px;border-radius:10px;border:none;background:var(--blue);color:#fff;font-size:16px;font-weight:600;cursor:pointer}
#gate-err{color:var(--red);font-size:13px;margin-top:10px;min-height:16px}
#app{display:none}
</style>
</head>
<body>
<div id="gate">
  <div id="gate-box">
    <h2>🔒 Далечна къща</h2>
    <input type="password" id="gate-input" placeholder="Парола" autocomplete="off">
    <button id="gate-btn">Влез</button>
    <div id="gate-err"></div>
  </div>
</div>
<div id="app">
  <h1>🏠 Далечна къща</h1>
  <div class="status-line" id="statusLine">Свързване...</div>

  <div class="card">
    <div class="temps">
      <div class="temp-box"><div class="temp-val" id="tempVatreshna">—</div><div class="temp-lbl">🌡 Вътрешна</div></div>
      <div class="temp-box"><div class="temp-val" id="tempVanshna">—</div><div class="temp-lbl">🌡 Външна</div></div>
    </div>
  </div>

  <div class="card">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
      <span style="font-weight:600">❄️ Климатик</span>
      <button class="sw" id="acPowerBtn" onclick="toggleAcPower()"></button>
    </div>
    <div class="ac-modes">
      <button class="ac-btn" id="acModeCool" onclick="setAc('mode','cool')">❄ Cool</button>
      <button class="ac-btn" id="acModeHeat" onclick="setAc('mode','heat')">🔥 Heat</button>
      <button class="ac-btn" id="acModeDry" onclick="setAc('mode','dry')">💧 Dry</button>
      <button class="ac-btn" id="acModeFan" onclick="setAc('mode','fan')">🌀 Fan</button>
    </div>
    <div class="ac-temp">
      <button class="ac-round" onclick="stepAcTemp(-1)">−</button>
      <div class="ac-temp-val" id="acTempVal">24°C</div>
      <button class="ac-round" onclick="stepAcTemp(1)">+</button>
    </div>
    <div class="ac-modes">
      <button class="ac-btn" id="acFanAuto" onclick="setAc('fan','auto')">Auto</button>
      <button class="ac-btn" id="acFanLow" onclick="setAc('fan','low')">Low</button>
      <button class="ac-btn" id="acFanMid" onclick="setAc('fan','mid')">Mid</button>
      <button class="ac-btn" id="acFanHigh" onclick="setAc('fan','high')">High</button>
    </div>
  </div>

  <div class="card">
    <div class="temps">
      <div class="temp-box"><div class="temp-val" id="pzemV">—</div><div class="temp-lbl">⚡ Волта</div></div>
      <div class="temp-box"><div class="temp-val" id="pzemW">—</div><div class="temp-lbl">⚡ Ватове</div></div>
    </div>
  </div>

  <div class="card">
    <div id="relayList"></div>
  </div>

  <div class="footer-note">Автоматично обновяване на всеки няколко секунди</div>

</div>
<script src="https://cdn.jsdelivr.net/npm/mqtt/dist/mqtt.min.js"></script>
<script>
const MQTT_HOST = '65bdce91cd294059b327d8cc6d9744e2.s1.eu.hivemq.cloud';
const MQTT_PORT = 8884;
const MQTT_USER = 'DENISHOUSE';
const MQTT_PASS = 'denis1224';

const relayState = {1:false, 2:false, 3:false, 4:false, 5:false};
let client = null;
let lastMessageTime = 0;

function renderRelays() {
  let html = '';
  for (let i = 1; i <= 5; i++) {
    const on = relayState[i];
    html += `<div class="relay-row"><span class="relay-name">Реле ${i}</span>
      <button class="sw ${on ? 'on' : 'off'}" onclick="toggleRelay(${i})"></button></div>`;
  }
  document.getElementById('relayList').innerHTML = html;
}

function toggleRelay(i) {
  const newState = !relayState[i];
  relayState[i] = newState;
  renderRelays();
  if (client && client.connected) {
    client.publish(`remotehouse/relay${i}/cmd`, newState ? '1' : '0');
  }
}

function updateStatusLine() {
  const el = document.getElementById('statusLine');
  const secondsAgo = (Date.now() - lastMessageTime) / 1000;
  if (lastMessageTime > 0 && secondsAgo < 90) {
    el.textContent = '🟢 Свързано';
    el.className = 'status-line online';
  } else {
    el.textContent = '⚠️ Няма скорошни данни от къщата';
    el.className = 'status-line offline';
  }
}

function connectMqtt() {
  const url = `wss://${MQTT_HOST}:${MQTT_PORT}/mqtt`;
  client = mqtt.connect(url, {
    username: MQTT_USER,
    password: MQTT_PASS,
    clientId: 'webpanel-' + Math.random().toString(16).slice(2, 10),
    reconnectPeriod: 5000,
  });

  client.on('connect', () => {
    client.subscribe('remotehouse/status');
    document.getElementById('statusLine').textContent = 'Изчакване на данни...';
  });

  client.on('message', (topic, payload) => {
    try {
      const data = JSON.parse(payload.toString());
      document.getElementById('tempVatreshna').textContent = (data.temp_vatreshna ?? 0).toFixed(1) + '°C';
      document.getElementById('tempVanshna').textContent = (data.temp_vanshna ?? 0).toFixed(1) + '°C';
      for (let i = 1; i <= 5; i++) {
        relayState[i] = !!data['relay' + i];
      }
      renderRelays();
      updateAcUI(data.ac_power, data.ac_mode, data.ac_temp, data.ac_fan);
      if (data.pzem_voltage !== undefined) document.getElementById('pzemV').textContent = data.pzem_voltage.toFixed(0) + 'V';
      if (data.pzem_power !== undefined) document.getElementById('pzemW').textContent = data.pzem_power.toFixed(0) + 'W';
      lastMessageTime = Date.now();
      updateStatusLine();
    } catch (e) {}
  });

  client.on('error', () => {
    document.getElementById('statusLine').textContent = '⚠️ Грешка при връзка';
    document.getElementById('statusLine').className = 'status-line offline';
  });
}

let acTempCurrent = 24;

function updateAcUI(power, mode, temp, fan) {
  const btn = document.getElementById('acPowerBtn');
  btn.className = 'sw ' + (power ? 'on' : 'off');
  if (temp !== undefined && temp !== null) {
    acTempCurrent = temp;
    document.getElementById('acTempVal').textContent = temp + '°C';
  }
  for (const m of ['cool','heat','dry','fan']) {
    document.getElementById('acMode' + m[0].toUpperCase() + m.slice(1)).classList.toggle('active', mode === m);
  }
  for (const f of ['auto','low','mid','high']) {
    document.getElementById('acFan' + f[0].toUpperCase() + f.slice(1)).classList.toggle('active', fan === f);
  }
}
function acPublish(topic, payload) {
  if (client && client.connected) client.publish(topic, String(payload));
}
function toggleAcPower() {
  const on = !document.getElementById('acPowerBtn').classList.contains('on');
  acPublish('remotehouse/ac/power', on ? '1' : '0');
  document.getElementById('acPowerBtn').className = 'sw ' + (on ? 'on' : 'off');
}
function setAc(key, val) {
  acPublish('remotehouse/ac/' + key, val);
  if (key === 'mode') for (const m of ['cool','heat','dry','fan']) document.getElementById('acMode' + m[0].toUpperCase() + m.slice(1)).classList.toggle('active', val === m);
  if (key === 'fan') for (const f of ['auto','low','mid','high']) document.getElementById('acFan' + f[0].toUpperCase() + f.slice(1)).classList.toggle('active', val === f);
}
function stepAcTemp(delta) {
  acTempCurrent = Math.min(31, Math.max(16, acTempCurrent + delta));
  document.getElementById('acTempVal').textContent = acTempCurrent + '°C';
  acPublish('remotehouse/ac/temp', acTempCurrent);
}

const SITE_PASS = 'denis4444'; // смени с каквото искаш - виж бележката в чата

function unlock() {
  document.getElementById('gate').style.display = 'none';
  document.getElementById('app').style.display = 'block';
  renderRelays();
  connectMqtt();
  setInterval(updateStatusLine, 5000);
}

function tryLogin() {
  const val = document.getElementById('gate-input').value;
  if (val === SITE_PASS) {
    localStorage.setItem('rh_unlocked', '1');
    unlock();
  } else {
    document.getElementById('gate-err').textContent = 'Грешна парола';
  }
}
document.getElementById('gate-btn').addEventListener('click', tryLogin);
document.getElementById('gate-input').addEventListener('keydown', (e) => { if (e.key === 'Enter') tryLogin(); });

if (localStorage.getItem('rh_unlocked') === '1') {
  unlock();
}
</script>
</body>
</html>
